server.port=8080
spring.application.name=springx-api

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

app.security.oidc.issuer-uri=${OIDC_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:0/unconfigured}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:springx}}
spring.datasource.username=${DB_USER:${DB_USERNAME:springx}}
spring.datasource.password=${DB_PASSWORD:springx}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:26MB}
